<VirtualHost *:80>
    ServerName sistema.agenciacalidadsanjuan.com.ar
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/sistema/dist

    ErrorLog ${APACHE_LOG_DIR}/sistema-error.log
    CustomLog ${APACHE_LOG_DIR}/sistema-access.log combined

    ProxyPass /api/ http://localhost:4000/api/
    ProxyPassReverse /api/ http://localhost:4000/api/

    <Directory /var/www/sistema/dist>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
